[project]
name = "real-estate-parser"
version = "0.1.0"
description = "Deterministic foundation for the real estate parser"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
quality = "real_estate_parser.quality:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
